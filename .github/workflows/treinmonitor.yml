
name: Treinmonitor Tiel 07:53

on:
  schedule:
    - cron: '*/5 5-7 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Uitvoermodus'
        required: true
        default: 'test-match'
        type: choice
        options:
          - test-match
          - test-live
          - test-api
          - test-push
          - monitor

permissions:
  contents: read

concurrency:
  group: treinmonitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous status
        uses: actions/cache/restore@v4
        with:
          path: monitor_state.json
          key: train-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            train-state-

      - name: Check train
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          python monitor.py "${RUN_MODE:-monitor}"

      - name: Save current status
        if: success() && hashFiles('monitor_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: monitor_state.json
          key: train-state-${{ github.run_id }}-${{ github.run_attempt }}
